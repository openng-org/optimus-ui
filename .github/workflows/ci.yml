name: CI

on:
    push:
        branches: [main]
    pull_request:
        types: [synchronize, opened, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    commitlint:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Use Node.js 24.x
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: 'pnpm'

            - name: Install packages
              run: |
                  pnpm install

            - name: Lint commit messages
              run: |
                  pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    ci:
        permissions:
            issues: write
            pull-requests: write
            checks: write # action-junit-report publishes the results as a check run
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - uses: actions/checkout@v3
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: Install packages
              run: |
                  pnpm install

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      playwright-${{ runner.os }}-

            - name: Install Playwright Chromium
              run: |
                  pnpm --filter @openng/optimus-ui exec playwright install --with-deps chromium

            - name: Code Format
              id: codeFormat
              run: |
                  pnpm run format:check

            # Both suites run to completion even when one fails, so the report below
            # always covers both. The gate step afterwards fails the job.
            - name: Unit Test (jasmine)
              id: unitTest
              continue-on-error: true
              run: |
                  pnpm run test:unit

            - name: Schematic Tests
              id: schematicTest
              run: |
                  pnpm --filter @openng/optimus-ui test:schematics

            - name: Unit Test (vitest)
              id: unitTestVitest
              continue-on-error: true
              run: |
                  pnpm run test:vitest

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'packages/optimus-ui/reports/junit/*.xml'
                  check_name: 'Test Results'
                  detailed_summary: true
                  include_passed: false
                  fail_on_failure: false

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: junit-reports
                  path: packages/optimus-ui/reports/junit/*.xml
                  if-no-files-found: warn

            - name: Fail if any unit test failed
              if: steps.unitTest.outcome == 'failure' || steps.unitTestVitest.outcome == 'failure'
              run: |
                  echo "jasmine: ${{ steps.unitTest.outcome }} / vitest: ${{ steps.unitTestVitest.outcome }}"
                  exit 1

            - name: Build
              id: build
              run: |
                  pnpm run build
