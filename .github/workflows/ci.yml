name: CI

on:
    push:
        branches: [main]
    pull_request:
        types: [synchronize, opened, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    commitlint:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup

            - name: Lint commit messages
              run: |
                  pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    # Formatting, the dependency audit and the schematics suite are all short and need no
    # browser, so they share a job rather than each paying the setup cost.
    checks:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Code Format
              run: |
                  pnpm run format:check

            - name: Security Audit
              run: |
                  pnpm run security:check

            - name: Schematic Tests
              run: |
                  pnpm --filter @openng/optimus-ui test:schematics

    # The jasmine and vitest suites run as separate jobs so that each always runs and always
    # publishes its report, whatever the other one does.
    test-karma:
        permissions:
            contents: read # a job-level block replaces the workflow default, so restate it
            checks: write # action-junit-report publishes the results as a check run
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            # No Playwright here: karma-chrome-launcher uses the runner image's Chrome.
            - name: Unit Test (jasmine)
              run: |
                  pnpm run test:unit

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: 'packages/optimus-ui/reports/junit/jasmine.xml'
                  check_name: 'Test Results (jasmine)'
                  detailed_summary: true
                  include_passed: false
                  fail_on_failure: false

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: junit-jasmine
                  path: packages/optimus-ui/reports/junit/jasmine.xml
                  if-no-files-found: warn

    test-vitest:
        permissions:
            contents: read # a job-level block replaces the workflow default, so restate it
            checks: write # action-junit-report publishes the results as a check run
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      playwright-${{ runner.os }}-

            - name: Install Playwright Chromium
              run: |
                  pnpm --filter @openng/optimus-ui exec playwright install --with-deps chromium

            - name: Cache Angular build cache
              uses: actions/cache@v6
              with:
                  path: packages/optimus-ui/.angular/cache
                  key: angular-vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
                  restore-keys: |
                      angular-vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      angular-vitest-${{ runner.os }}-

            - name: Unit Test (vitest)
              run: |
                  pnpm run test:vitest

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: 'packages/optimus-ui/reports/junit/vitest.xml'
                  check_name: 'Test Results (vitest)'
                  detailed_summary: true
                  include_passed: false
                  fail_on_failure: false

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: junit-vitest
                  path: packages/optimus-ui/reports/junit/vitest.xml
                  if-no-files-found: warn

    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Cache Angular build cache
              uses: actions/cache@v6
              with:
                  path: |
                      packages/optimus-ui/.angular/cache
                      apps/docs/.angular/cache
                  key: angular-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
                  restore-keys: |
                      angular-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      angular-build-${{ runner.os }}-

            # build:packages rather than build, because build re-runs format:check and
            # security:check, which the checks job already covers. NODE_ENV belongs on this
            # step only: setting it job-wide would make pnpm install skip devDependencies.
            - name: Build
              env:
                  NODE_ENV: production
              run: |
                  pnpm run build:packages
