name: Release

# Changesets-driven releases (https://github.com/changesets/changesets):
#   - PRs that touch published packages include a changeset file (`pnpm changeset`).
#   - On every push to main this workflow keeps a "Version Packages" PR up to date; that PR
#     applies the pending changesets: bumps all packages in lockstep (they are `fixed` in
#     .changeset/config.json), updates the root CHANGELOG.md and deletes the changeset files.
#   - Merging the Version Packages PR re-runs this workflow, which then builds and publishes
#     every changed package to npm, tags the release and creates a GitHub release.
#
# While .changeset/pre.json is committed, releases are rc prereleases (1.0.0-rc.N) published
# under the `rc` dist-tag. Exit with `pnpm changeset pre exit` when ready to cut 1.0.0.
#
# Security model:
#   - npm authentication uses trusted publishing (OIDC): there is NO npm token stored in
#     this repository or its secrets. Each @openng/* package must list this repository and
#     this workflow file (release.yml) as a trusted publisher on npmjs.com. Renaming this
#     file breaks publishing until that configuration is updated.
#   - Provenance attestations are generated automatically by npm for OIDC publishes.
#   - Third-party actions are pinned to commit SHAs.

on:
    push:
        branches: [main]

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Version or publish
        runs-on: ubuntu-latest
        permissions:
            contents: write # push the version branch and release tag, create the GitHub release
            pull-requests: write # open/update the Version Packages PR
            id-token: write # required for npm trusted publishing (OIDC)
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  run_install: false

            - name: Use Node.js 24.x
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x
                  cache: 'pnpm'

            - name: Install packages
              run: pnpm install

            - name: Version PR or publish to npm
              id: changesets
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  version: pnpm run version
                  publish: pnpm run release
                  commit: 'chore(release): version packages'
                  title: 'chore(release): version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag and create GitHub release
              if: steps.changesets.outputs.published == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION=$(node -p "require('./packages/optimus-ui/package.json').version")
                  # Aggregate release tag matching this repo's historical tag format (no "v" prefix),
                  # alongside the per-package tags created by changeset publish.
                  if ! git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
                      git tag "$VERSION"
                      git push origin "$VERSION"
                  fi
                  # Release notes = this version's section of CHANGELOG.md.
                  awk -v ver="$VERSION" '
                      /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
                      found { print }
                  ' CHANGELOG.md > /tmp/release-notes.md
                  if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
                      echo "::error::Could not extract release notes for $VERSION from CHANGELOG.md"
                      exit 1
                  fi
                  EXTRA_ARGS=()
                  case "$VERSION" in *-*) EXTRA_ARGS+=(--prerelease);; esac
                  if gh release view "$VERSION" > /dev/null 2>&1; then
                      echo "GitHub release $VERSION already exists"
                  else
                      gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file /tmp/release-notes.md "${EXTRA_ARGS[@]}"
                  fi
